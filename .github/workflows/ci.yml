name: CI

# Runs on every push to main and every PR into it. Without this gate the suite
# rots within a fortnight — a test nobody runs is a test that doesn't exist.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` installs from the lockfile exactly — reproducible, and fails
      # loudly if package.json and the lockfile disagree.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
